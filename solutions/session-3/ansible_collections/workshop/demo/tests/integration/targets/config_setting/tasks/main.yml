---
# Integration test target (reference solution).
# Run: ansible-test integration config_setting

- name: First run creates the setting
  workshop.demo.config_setting:
    path: /tmp/ws_integration.conf
    key: debug
    value: "true"
  register: first

- name: Second run is a no-op (idempotency)
  workshop.demo.config_setting:
    path: /tmp/ws_integration.conf
    key: debug
    value: "true"
  register: second

- name: Change the value
  workshop.demo.config_setting:
    path: /tmp/ws_integration.conf
    key: debug
    value: "false"
  register: third

- name: Assert behavior
  ansible.builtin.assert:
    that:
      - first is changed
      - second is not changed
      - third is changed
    fail_msg: "config_setting is not idempotent!"

- name: Clean up
  ansible.builtin.file:
    path: /tmp/ws_integration.conf
    state: absent
